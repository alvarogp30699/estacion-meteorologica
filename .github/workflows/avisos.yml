name: Avisos AEMET

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # cada 15 min, fuera de la hora en punto (GitHub va más saturado a :00)
  workflow_dispatch:          # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write

concurrency:
  group: avisos
  cancel-in-progress: false

jobs:
  avisos:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Avisos (MeteoAlarm, sin clave)
        env:
          ZONAS: "Litoral sur de Tarragona|Litoral sud de Tarragona"
        run: python3 tools/avisos.py
      - name: Avisos de Meteocat (necesita el secreto METEOCAT_API_KEY)
        continue-on-error: true
        env:
          METEOCAT_API_KEY: ${{ secrets.METEOCAT_API_KEY }}
          COMARCA: "Tarragonès"
          COMARCA_ID: "36"
        run: python3 tools/meteocat.py
      - name: Clima precalculado (normales y récords, una vez al mes)
        continue-on-error: true
        timeout-minutes: 4
        env:
          LAT: "41.0765"
          LON: "1.1414"
        run: python3 tools/clima.py
      - name: Estación de AEMET (necesita el secreto AEMET_API_KEY)
        continue-on-error: true
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
          ESTACION: "0016A"
          ESTACION_NOMBRE: "Reus aeropuerto"
        run: python3 tools/observacion.py
      - name: Historial propio de la estación (necesita AEMET_API_KEY)
        continue-on-error: true
        timeout-minutes: 4
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
          ESTACION: "0016A"
          ESTACION_NOMBRE: "Reus aeropuerto"
        run: python3 tools/historial.py
      - name: Rayos del satélite MTG (necesita EUMETSAT_KEY y EUMETSAT_SECRET)
        continue-on-error: true
        timeout-minutes: 4
        env:
          EUMETSAT_KEY: ${{ secrets.EUMETSAT_KEY }}
          EUMETSAT_SECRET: ${{ secrets.EUMETSAT_SECRET }}
          LAT: "41.0765"
          LON: "1.1414"
        run: |
          if [ -z "$EUMETSAT_KEY" ]; then echo "Sin claves de EUMETSAT: se omiten los rayos"; exit 0; fi
          pip install --quiet eumdac netCDF4
          python3 tools/rayos.py
      - name: Guardar si ha cambiado
        run: |
          for f in avisos.json meteocat.json clima.json observacion.json historial.json rayos.json; do [ -f "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then echo "Nada que guardar"; exit 0; fi
          git config user.name "avisos-bot"
          git config user.email "avisos-bot@users.noreply.github.com"
          git commit -m "Datos AEMET $(date -u +%H:%M)"
          git push
